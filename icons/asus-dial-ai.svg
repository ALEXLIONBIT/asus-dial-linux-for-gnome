<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241b52"/><stop offset="0.55" stop-color="#0e0c26"/><stop offset="1" stop-color="#05060f"/></linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c4dff" stop-opacity="0.55"/><stop offset="0.6" stop-color="#7c4dff" stop-opacity="0.12"/><stop offset="1" stop-color="#7c4dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="64" y1="192" x2="215" y2="105"><stop offset="0" stop-color="#00f0ff"/><stop offset="0.5" stop-color="#8f5cff"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient>
    <radialGradient id="knob" cx="0.32" cy="0.26" r="0.95"><stop offset="0" stop-color="#4d5278"/><stop offset="0.5" stop-color="#1f2140"/><stop offset="1" stop-color="#0b0c1e"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/><stop offset="1" stop-color="#9b8cff" stop-opacity="0.4"/></linearGradient>
    <linearGradient id="star" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#bff6ff"/><stop offset="1" stop-color="#c9b2ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="124" fill="url(#aura)"/>

  <!-- track -->
  <path d="M64.4 191.6 A90 90 0 1 1 191.6 191.6" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="10" stroke-linecap="round"/>
  <!-- glowing value arc -->
  <path d="M64.4 191.6 A90 90 0 1 1 215 104.7" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
  <path d="M64.4 191.6 A90 90 0 1 1 215 104.7" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round"/>
  <!-- end-of-arc indicator -->
  <circle cx="215" cy="104.7" r="9" fill="#fff" filter="url(#soft)" opacity="0.9"/>
  <circle cx="215" cy="104.7" r="4.5" fill="#fff"/>

  <!-- knob -->
  <circle cx="128" cy="136" r="62" fill="#000" opacity="0.45" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="62" fill="url(#knob)"/>
  <circle cx="128" cy="128" r="61" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1.5"/>
  <path d="M86 108 A46 46 0 0 1 134 83" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>

  <!-- AI sparkle -->
  <path d="M128 88 C130.5 113 143 125.5 168 128 C143 130.5 130.5 143 128 168 C125.5 143 113 130.5 88 128 C113 125.5 125.5 113 128 88Z" fill="#7cf3ff" filter="url(#soft)" opacity="0.75"/>
  <path d="M128 88 C130.5 113 143 125.5 168 128 C143 130.5 130.5 143 128 168 C125.5 143 113 130.5 88 128 C113 125.5 125.5 113 128 88Z" fill="url(#star)"/>
  <!-- small sparkles -->
  <path d="M190 150 C190.6 156 192.6 158 198.6 158.6 C192.6 159.2 190.6 161.2 190 167.2 C189.4 161.2 187.4 159.2 181.4 158.6 C187.4 158 189.4 156 190 150Z" fill="#fff" opacity="0.9"/>
  <path d="M70 84 C70.4 88 71.8 89.4 75.8 89.8 C71.8 90.2 70.4 91.6 70 95.6 C69.6 91.6 68.2 90.2 64.2 89.8 C68.2 89.4 69.6 88 70 84Z" fill="#fff" opacity="0.7"/>
</svg>
